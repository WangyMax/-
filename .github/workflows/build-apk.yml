name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Committed Web Assets
        run: |
          grep -- "--c-canvas" android/app/src/main/assets/public/assets/*.css
          grep "bg-canvas" android/app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.15
          name: "FitCustom Pro v2.8.15 (全新今日训练界面)"
          body: |
            ### v2.8.15：全新今日训练界面（覆盖安装版）
            1. 与 v2.8.14 相同的全新今日训练页与设计系统。
            2. versionCode 提升到 34，确保覆盖安装时高于手机上的 2.8.12。
            3. 数据兼容：包名与签名不变；覆盖安装保留原计划、训练、体重与生活日志。不要卸载；升级前建议导出 JSON 备份。
            4. 本版先完成今日训练相关页面；计划分化、动作库、日志页的视觉迁移在后续版本继续。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
