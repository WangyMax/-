name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Committed Web Assets
        run: |
          grep -- "--c-canvas" android/app/src/main/assets/public/assets/*.css
          grep "bg-canvas" android/app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.19
          name: "FitCustom Pro v2.8.19 (全站视觉统一)"
          body: |
            ### v2.8.19：全站视觉统一完成
            1. 日志记录页、计划分化页、动作库页全部迁移到新设计系统（灰阶 + 电蓝 token、统一 Sheet 弹窗与 SegmentedControl 分段控件）。
            2. 全站旧调色板彻底清零：删除 CATEGORY_LABELS 中的彩色样式字段（已无组件引用），分类标签统一中性 Badge；产物中旧色类命中 0。
            3. 日历改为日期数字直接着色；动作库编辑表单为「左右独立 / 超级组」并排双选卡；所有弹窗统一 Sheet，所有分段统一 SegmentedControl；图标按钮均有 aria-label。
            4. 数据兼容：包名与签名不变，versionCode 38；覆盖安装保留原计划、训练、体重与生活日志。未改动任何存储键与数据结构。

            ### 已包含历史版本
            v2.8.16：日志与体重修复——体重汇总按今天（当天无记录时保持空，不再残留上次数据）、历史训练编辑支持有氧编辑（无有氧/有有氧，可改时长类型备注）、训练结束弹窗可选无有氧/有有氧并填 1–300 分钟。
            v2.8.13–2.8.16：设计系统与今日训练页新视觉；计划分化、动作库、日志页视觉迁移；同步产物打包与校验加固。
            v2.8.12：状态栏改为原生 insets 统一避让（修复一加等机型顶部重叠）；移除恢复官方记录按钮；真机导出 JSON 改为写入后调系统分享面板，并给出成功/取消/失败提示。
            v2.8.11：修复超级组真机不生效——内置超级组飞鸟补标记与四阶并加老数据补丁、动作库全库可编辑、历史编辑一键切换超级组。
            v2.8.10：动作库支持标记递减超级组与预设阶梯；历史新增动作默认 4 组；训练新增动作 4 组留空待填。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
