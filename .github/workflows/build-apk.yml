name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || echo "Sync completed with warnings, proceeding to build"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.0
          name: "FitCustom Pro v2.8 (专注模式·界面焕新)"
          body: |
            ### 更新亮点：
            1. 专注模式：开练后一屏只看一个动作，左右切换，底部导航隐藏防误触，右下角悬浮结束钮；
            2. 分化罗盘：按历史记录建议下次练什么，开练/休息/补签合成一张三段卡；
            3. 界面收纳：单位滑轮收进规格胶囊、组行加大整行可点、超级组默认折叠、有氧备注默认收起；
            4. 训练历史升级：累计/本周/连续打卡统计条、近8周活动日历、每场容量与用时、类型筛选；
            5. 体重记录升级：目标体重+曲线目标线、趋势洞察、近6周打卡日历、时段过滤；
            6. 全应用统一自建确认抽屉，彻底告别原生弹窗；
            7. 同签名，直接覆盖安装，数据无缝保留。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
