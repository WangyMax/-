name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Committed Web Assets
        run: |
          grep -- "--c-canvas" android/app/src/main/assets/public/assets/*.css
          grep "bg-canvas" android/app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.16
          name: "FitCustom Pro v2.8.16 (日志与体重修复)"
          body: |
            ### v2.8.16：日志与体重修复
            1. 体重汇总按今天：当天没有记录时输入框和汇总保持空，不再残留上一次数据；切换日期能正确载入/清空。
            2. 历史训练编辑新增有氧编辑：无有氧 / 有有氧，可改自定义时长、类型、备注；保存后列表徽章与展开明细同步。
            3. 训练结束弹窗新增有氧选择：无有氧 / 有有氧，有有氧可填 1–300 分钟；归档前统一数据语义。
            4. 数据兼容：包名与签名不变，versionCode 35；覆盖安装保留原计划、训练、体重与生活日志。未编辑的旧记录不主动改动；编辑保存时再规范化有氧字段。
            5. 本版仍只包含今日训练页的新视觉；计划分化、动作库、日志页的视觉迁移在后续版本继续。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
