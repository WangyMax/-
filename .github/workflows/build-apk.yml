name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || echo "Sync completed with warnings, proceeding to build"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "FitCustom Pro v2.0 (重磅专业升级：完整递减超级组系统上线)"
          body: |
            ### 更新亮点：
            1. 专业递减超级组模型：大组自定义（默认4大组），每组包含多阶梯连续递减重量与独立次数；
            2. 开练看板定制超级组大组卡片：直观呈现递减流（10kg/12次 -> 7.5kg/12次 -> 5kg/10次 -> 2.5kg/12次），每个阶梯重量与次数均可独立调整，支持自由增删递减阶梯与大组；
            3. 计划编辑与历史记录全面升级：自定义超级组大组与阶梯，精准还原 10.08 肩部真实超级组数据。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
