name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || echo "Sync completed with warnings, proceeding to build"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "FitCustom Pro v1.3 (状态栏安全适配 + 纯粹记录免计时 + 周月视图动态联动 + 历史默认全部折叠)"
          body: |
            ### 更新亮点：
            1. 修复状态栏兼容重叠：顶部配置沉浸式安全避让空间，彻底解决与手机电量/时间重叠；
            2. 移除所有计时功能：进入训练后无需计时，去除秒表与休息弹窗，专注每组负荷记录；
            3. 周/月视图动态走势联动：按钮高亮与状态横幅即时响应，30天月度时间轴全景平滑展开；
            4. 历史训练记录默认 100% 全部折叠，无需展开，界面紧凑清爽。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
