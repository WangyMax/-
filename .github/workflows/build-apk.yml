name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || echo "Sync completed with warnings, proceeding to build"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.11
          name: "FitCustom Pro v2.8.11 (超级组真机修复+全库可编辑+历史一键切换)"
          body: |
            ### 更新亮点：
            1. 专注模式：开练后一屏只看一个动作，左右切换，底部导航隐藏防误触，右下角悬浮结束钮；
            2. 分化罗盘：按历史记录建议下次练什么，开练/休息/补签合成一张三段卡；
            3. 界面收纳：单位滑轮收进规格胶囊、组行加大整行可点、超级组默认折叠、有氧备注默认收起；
            4. 训练历史升级：累计/本周/连续打卡统计条、近8周活动日历、每场容量与用时、类型筛选；
            5. 体重记录升级：目标体重+曲线目标线、趋势洞察、近6周打卡日历、时段过滤；
            6. 全应用统一自建确认抽屉，彻底告别原生弹窗；
            7. 同签名，直接覆盖安装，数据无缝保留。
            8. [v2.8.1] 修复目标体重编辑行在小屏上横向溢出、保存按钮被挤出屏外的问题；全局禁止页面横滑。
            9. [v2.8.2] 修复删除确认抽屉与全部底部弹窗被底部导航盖住导致确认删除点不到的问题：弹窗层级提到导航之上，确认框加底部安全区；计划编辑/动作挑选、训练规格/加动作/完成祝贺弹窗同步提层级。
            10. [v2.8.3] 历史训练记录可编辑（改组重量次数、单侧左右、删组、改备注，同 id 写回）；动作库按部位分组展示，自定义动作归入同类分组末尾且可编辑可删除（被计划引用时拦截）；每个动作可标左右独立，训练时左右分别记录重量次数，容量左右累加。
            11. [v2.8.4] 历史编辑升级为完整编辑：动作可改名、可换动作、可新增动作、可删整组动作；每组可加一组；单双侧随时切换（切单侧左右默认取主字段值）；换动作保留组数与备注，单侧按新动作重建左右。
            12. [v2.8.5] 修复历史编辑弹窗单侧两行输入框错位：左右行统一网格列，重量、次数、单位上下对齐。
            13. [v2.8.6] 历史记录名称可直接改名（仅改本条记录）；计划编辑支持从过往训练导入为模板（取已完成组重量次数做预设，含单侧与超级组）。
            14. [v2.8.7] 自由训练添加动作弹窗新增可折叠「自定义新动作」表单，保存后写入动作库并加入本次训练；规格抽屉新增「记录方式」双侧/左右手分开开关，可随时切换且数据不丢，可选「同时记住到动作库」。
            15. [v2.8.8] 自由训练开练时顶部名称支持直接点击内联编辑自拟；历史记录挑选动作弹窗补齐折叠「自定义新动作」表单；分化罗盘智能按完成动作部位多级推断，彻底告别自由训练盲目兜底为胸；全局阻断弹窗滚动穿透，顶部状态栏垫片与弹窗安全避让加固。
            16. [v2.8.9] 历史记录编辑中每个动作卡片新增规格胶囊按钮，点击弹出规格抽屉随时切换计量单位（片/kg/助力/自重）与滑轮比例（普通/单滑轮1:1/双滑轮2:1），切换后整组所有组自动同步更新并写回。
            17. [v2.8.10] 动作库新增编辑支持标记递减超级组并预设阶梯（默认 10/7.5/5/2.5kg 四阶，与单侧互斥）；历史记录新增动作默认改为 4 组，超级组动作生成 4 个大组；训练中新增动作 4 组重量次数留空待填，不再复用上次记录。
            18. [v2.8.11] 修复超级组真机不生效：内置超级组飞鸟补标记与四阶并加老数据补丁不清数据生效；动作库全库可点编辑（内置锁名与部位）；历史编辑每组加设为超级组/取消超级组一键切换，换动作保留标记。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
