name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Fresh Web Application Into Android
        run: npx cap sync android

      - name: Verify Synced Web Assets
        run: |
          grep -- "--c-canvas" android/app/src/main/assets/public/assets/*.css
          grep "bg-canvas" android/app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          if ! ./gradlew assembleDebug --stacktrace > android-build.log 2>&1; then
            cat android-build.log
            python3 - <<'PY'
          from pathlib import Path
          log = Path('android-build.log').read_text(errors='replace')
          marker = log.find('* What went wrong:')
          detail = log[marker:marker + 6000] if marker >= 0 else log[-6000:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build diagnosis::' + detail)
          PY
            exit 1
          fi
          cat android-build.log
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FitCustomPro-v2.9.4.apk

      - name: Verify APK Signature and Upgrade Version
        run: |
          signing_tool="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          package_tool="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          "$signing_tool" verify --verbose --print-certs android/app/build/outputs/apk/debug/FitCustomPro-v2.9.4.apk
          "$package_tool" dump badging android/app/build/outputs/apk/debug/FitCustomPro-v2.9.4.apk | grep "package: name='com.fitcustom.pro' versionCode='43' versionName='2.9.4'"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.4
          name: "FitCustom Pro v2.9.4（自动休息与全局设置）"
          body: |
            ### 本次更新
            - 新增「未训练自动休息」：没训练的日子自动记为休息，不需要每天打卡今日休息（可在设置关闭）。
            - 今日训练页右上角新增设置入口：统一显示/隐藏超级组、左右组、有氧、备注、补签与自由训练入口。
            - 开关只影响入口显示，已有训练、超级组、单侧、有氧和备注记录照常显示与统计。
            - 历史记录补出过去的休息日（只读，带「自动」标记），连续打卡与 8 周日历同步更新。
            - 关闭自动休息后恢复原来的手动休息与补签流程。

            ### 数据兼容
            versionCode 43；沿用原签名与包名 com.fitcustom.pro，支持从 v2.9.3 覆盖安装，无需卸载，保留本地数据。

          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/FitCustomPro-v2.9.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
