name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || echo "Sync completed with warnings, proceeding to build"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: "FitCustom Pro v1.4 (一加流体云灵动胶囊 + 2分钟组间间歇 + 硬件震动)"
          body: |
            ### 更新亮点：
            1. 专为 OPPO / 一加 ACE 5 Pro 定制：顶部正中央常驻黑曜石质感“流体云灵动胶囊”；
            2. 每组做完打勾自动开启 2 分钟组间间歇倒计时，切到后台/息屏绝对时间戳保活不丢时长；
            3. 倒计时归零自动触发 ColorOS 线性马达高频节律硬件震动与清脆音效，提醒开练下一组；
            4. 胶囊支持轻触展开 ColorOS 控制卡片：快捷 +30秒、重置2分钟、跳过；做完下一组继续循环倒计时。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
