name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Committed Web Assets
        run: |
          grep -- "--c-canvas" android/app/src/main/assets/public/assets/*.css
          grep "bg-canvas" android/app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.1
          name: "FitCustom Pro v2.9.1 (隔天 12:00 用药提醒 + 系统日历)"
          body: |
            ### v2.9.1：用药提醒按你的使用习惯调整
            1. 底部导航回到 4 项：上一版新增的第 5 个「用药」Tab 撤下，第 4 项改为「每天记录体重」，点开直接落在体重记录子页签；训练历史仍在同页第二个子页签。
            2. 用药入口移到「计划分化」页顶部的一张卡片：待服时带小红点与「待服用」标签，副标题直接显示周期、提醒时间与下次应服日，点进去是用药管理页（页内左上角可返回）。
            3. 提醒时间默认改为中午 12:00，周期仍是隔一天一次（48 小时）；已安装的用户可在用药页把时间改成任意时刻，间隔也仍是每天 / 隔天 / 每 3 天可选。
            4. 新增「系统日历提醒」：用药页一键导出 .ics 日历文件（内含 RRULE:FREQ=DAILY;INTERVAL=2 的隔天重复规则 + 到点提醒），用系统日历导入一次后，由日历自己每两天中午提醒，App 被后台清理也不会漏；原生端会直接弹出分享面板，网页预览则直接下载。
            5. 沿用 v2.9.0 的全部能力：一键打卡与撤销、按应服日回溯 90 天的已服 / 漏服 / 跳过 / 待服判定、逾期补记标记、连续服药与依从率统计、最近 7 次连锁圆点、通知点击直达用药页、提醒总开关（关掉会同步取消已排通知）。
            6. 提醒仍走省电模式可用的非精确闹钟（无需「闹钟与提醒」特殊权限，最多延迟几分钟），重启手机自动恢复；建议把 App 加入国产 ROM 的「自启动 / 后台运行」白名单。

            ### v2.9.0 一并带来的既有问题修复
            1. 修复内置超级组「冷启动自己复活」：手动关掉飞鸟（ex-sho-03）的超级组不再被内置补丁改回来。
            2. 新增全局错误边界：页面渲染异常时不再整页白屏，改为「页面出错了」卡片 + 一键重载，并说明数据仍在本机。
            3. 历史「自定义新动作」表单补上「递减超级组（4 阶梯）」开关，勾选后自动切 kg 并清空单侧。
            4. 备份升级到 2.1：导出 JSON 包含用药配置与服药记录，导入兼容旧备份。

            ### 数据兼容
            包名与签名不变（fitcustom.keystore），versionCode 40；覆盖安装保留原计划、训练、体重、生活日志与用药数据，旧备份文件仍可正常导入。

            ### 已包含历史版本
            v2.9.0：新增用药管理（隔天服药记录与提醒）。
            v2.8.19：日志记录 / 计划分化 / 动作库全部迁移新设计系统（灰阶 + 电蓝 token、统一 Sheet 与 SegmentedControl）。
            v2.8.16：日志与体重修复——体重汇总按当天计算、历史训练支持有氧编辑、训练结束可选有氧时长。
            v2.8.12：状态栏改为原生 insets 统一避让；真机导出 JSON 改为写入后调系统分享面板。
            v2.8.11：修复超级组真机不生效，动作库全库可编辑，历史编辑一键切换超级组。
            v2.8.10：动作库支持标记递减超级组与预设阶梯；历史新增动作默认 4 组。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
