name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Fresh Web Application Into Android
        run: npx cap sync android

      - name: Verify Synced Web Assets
        run: |
          grep -- "--c-canvas" android/app/src/main/assets/public/assets/*.css
          grep "bg-canvas" android/app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FitCustomPro-v2.9.3.apk

      - name: Verify APK Signature and Upgrade Version
        run: |
          signing_tool="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          package_tool="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
          "$signing_tool" verify --verbose --print-certs android/app/build/outputs/apk/debug/FitCustomPro-v2.9.3.apk
          "$package_tool" dump badging android/app/build/outputs/apk/debug/FitCustomPro-v2.9.3.apk | grep "package: name='com.fitcustom.pro' versionCode='42' versionName='2.9.3'"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.3
          name: "FitCustom Pro v2.9.3（训练交互与体重图表优化）"
          body: |
            ### 本次更新
            - 有氧与滑轮默认关闭，按需手动开启；关闭后同步清理不适用内容。
            - 自重模式只填写次数，不显示重量输入。
            - 重复动作沿用上次重量，本次次数留空；递减组可逐阶编辑、增删与复制重量。
            - 重新设计体重周/月视图，按真实日期展示，支持点选查看数值。
            - 改善输入焦点、抽屉滚动与页面动效，并修复切换后的残留状态。
            - 构建时同步最新页面资源，确保安装包包含本次修改。

            ### 数据兼容
            versionCode 42；沿用原签名与包名 com.fitcustom.pro，支持从 v2.9.2 覆盖安装，无需卸载，保留本地数据。

          files: android/app/build/outputs/apk/debug/FitCustomPro-v2.9.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
