name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Committed Web Assets
        run: |
          grep -- "--c-canvas" android/app/src/main/assets/public/assets/*.css
          grep "bg-canvas" android/app/src/main/assets/public/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.14
          name: "FitCustom Pro v2.8.14 (全新今日训练界面)"
          body: |
            ### v2.8.14：全新视觉系统（第一阶段）
            1. 设计 token：灰阶画布 + 电蓝强调色，统一字号、圆角、边框、焦点态与数字等宽。
            2. 今日训练页改版：看板、分化罗盘、专注模式（普通 / 左右独立 / 超级组）、规格抽屉、添加动作面板。
            3. 添加动作拆成「从动作库选择 / 自定义新动作」两个标签页；超级组入口移入规格抽屉；自定义动作可并排选择左右独立 / 超级组。
            4. 规格入口改名「自定义编辑」；全站统一「超级组」文案。
            5. 数据兼容：包名与签名不变，versionCode 33；覆盖安装保留原计划、训练、体重与生活日志。不要卸载；升级前建议导出 JSON 备份。
            6. 本版先完成今日训练相关页面；计划分化、动作库、日志页的视觉迁移在后续版本继续。
            7. 构建修正：CI 直接使用仓库中已同步的 Android 网页资源，并在打包前校验设计 token 与页面标记，避免版本号更新但界面未更新的问题。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
