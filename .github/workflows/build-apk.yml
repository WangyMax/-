name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || echo "Sync completed with warnings, proceeding to build"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitCustomPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK Directly
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "FitCustom Pro v1.5 (OPPO一加系统级原生流体云胶囊 + 媒体会话联动)"
          body: |
            ### 更新亮点：
            1. 接入 Android 原生 MediaSessionCompat + MediaStyle 媒体流机制；
            2. 退到桌面或后台时，自动在 OPPO / 一加 ColorOS 打孔屏顶端唤起系统原生「流体云胶囊」；
            3. 每组打勾即开启 2 分钟间歇倒计时，切后台绝对时间戳保活，倒计时到 0 硬件线性马达强烈连震；
            4. 休息结束自动收回原生胶囊，下一组打勾继续循环。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
