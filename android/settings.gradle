include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

// Capacitor 插件也声明了独立的 buildscript 仓库；统一使用同一官方 Central 入口。
gradle.beforeProject { currentProject ->
    [currentProject.repositories, currentProject.buildscript.repositories].each { repositories ->
        repositories.configureEach { repository ->
            if (repository instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                    repository.url.host in ['repo.maven.apache.org', 'repo1.maven.org']) {
                repository.setUrl('https://maven-central.storage-download.googleapis.com/maven2')
            }
        }
    }
}
